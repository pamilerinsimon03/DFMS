name: Security Scan

on:
  push:
    branches: [ main, develop, thesis-security-design ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  static-analysis:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, mysqli, gd, imagick
        tools: phpstan, psalm
    
    - name: Run PHPStan
      run: phpstan analyse -c phpstan.neon --memory-limit=1G --no-progress
    
    - name: Run Psalm
      run: psalm --show-info=false

  test-suite:
    name: Automated PHPUnit Test Suite
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dfms_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, mysqli, gd, imagick
        tools: phpunit

    - name: Initialize Test Database
      env:
        DB_HOST: 127.0.0.1
        DB_NAME: dfms_test
        DB_USER: root
        DB_PASS: root
      run: |
        mysql -h 127.0.0.1 -u root -proot dfms_test < dfms_database.sql
        php app/scripts/run_migrations.php

    - name: Run PHPUnit Test Suite
      env:
        DB_HOST: 127.0.0.1
        DB_NAME: dfms_test
        DB_USER: root
        DB_PASS: root
        APP_ENV: testing
      run: phpunit

    - name: Execute Evaluation Harnesses
      env:
        DB_HOST: 127.0.0.1
        DB_NAME: dfms_test
        DB_USER: root
        DB_PASS: root
        APP_ENV: testing
      run: |
        php docs/evaluation/blur_calibration.php
        php docs/evaluation/clamav_latency.php
        php docs/evaluation/ocr_accuracy.php
        php docs/evaluation/auth_benchmark.php

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Run TruffleHog
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        extra_args: --debug --only-verified

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
    
    - name: Run Composer Audit
      run: |
        if [ -f composer.json ]; then
          composer audit --format=json > audit-results.json || true
        else
          echo '{"advisories":[]}' > audit-results.json
        fi
    
    - name: Upload audit results
      uses: actions/upload-artifact@v4
      with:
        name: composer-audit-results
        path: audit-results.json

  custom-security-checks:
    name: Custom Security Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
    
    - name: Check for hardcoded credentials
      run: |
        if grep -r -E "['\"]?(db_)?password['\"]?\s*=>?\s*['\"][^'\"]{3,}['\"]" app/config/ --include="*.php" | grep -v "update_passwords\|reset_password\|password_hash"; then
          echo "❌ Hardcoded credentials found!"
          exit 1
        else
          echo "✅ No hardcoded credentials found"
        fi
    
    - name: Check for SQL injection patterns
      run: |
        if grep -r -E "SELECT.*\\$.*" app/models/ --include="*.php" | grep -v "prepare\\|bind_param\\|real_escape_string"; then
          echo "❌ Potential SQL injection found!"
          exit 1
        else
          echo "✅ No obvious SQL injection patterns found"
        fi
    
    - name: Check for XSS patterns
      run: |
        if grep -r "echo.*\$" app/views/ --include="*.php" | grep -v -E "htmlspecialchars|htmlentities|json_encode|urlencode|http_build_query|date|number_format|count|isset|empty|in_array|str_replace|strtolower|User::|phpversion|generateCSRFToken|\?|\$index"; then
          echo "❌ Potential XSS vulnerability found!"
          exit 1
        else
          echo "✅ Output encoding appears to be in place"
        fi
    
    - name: Check for CSRF protection
      run: |
        if ! grep -r "csrf_token\|CSRF" app/; then
          echo "❌ No CSRF protection found!"
          exit 1
        else
          echo "✅ CSRF protection appears to be implemented"
        fi
    
    - name: Check file upload security
      run: |
        if grep -r "move_uploaded_file" app/ --include="*.php" | grep -v "pathinfo\|basename"; then
          echo "❌ File upload may be insecure!"
          exit 1
        else
          echo "✅ File upload appears to have some validation"
        fi

  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [static-analysis, test-suite, secret-scan, dependency-scan, custom-security-checks]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Generate security summary
      run: |
        echo "# Security Scan Results" > security-summary.md
        echo "## Static Analysis" >> security-summary.md
        echo "- PHPStan & Psalm: ${{ needs.static-analysis.result }}" >> security-summary.md
        echo "" >> security-summary.md
        echo "## Automated Test Suite & Benchmarks" >> security-summary.md
        echo "- PHPUnit & Evaluation Harnesses: ${{ needs.test-suite.result }}" >> security-summary.md
        echo "" >> security-summary.md
        echo "## Secret Scanning" >> security-summary.md
        echo "- TruffleHog: ${{ needs.secret-scan.result }}" >> security-summary.md
        echo "" >> security-summary.md
        echo "## Dependency Scan" >> security-summary.md
        echo "- Composer Audit: ${{ needs.dependency-scan.result }}" >> security-summary.md
        echo "" >> security-summary.md
        echo "## Custom Security Checks" >> security-summary.md
        echo "- Custom Checks: ${{ needs.custom-security-checks.result }}" >> security-summary.md
    
    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: security-scan-report
        path: security-summary.md
