# Sample Apache 2.4 VirtualHost Configuration for DFMS Production Deployment
# Place in /etc/apache2/sites-available/dfms.conf

<VirtualHost *:80>
    ServerName dfms.ui.edu.ng
    Redirect permanent / https://dfms.ui.edu.ng/
</VirtualHost>

<VirtualHost *:443>
    ServerName dfms.ui.edu.ng
    DocumentRoot /var/www/dfms

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/dfms.crt
    SSLCertificateKeyFile /etc/ssl/private/dfms.key

    # X-Sendfile acceleration module (mod_xsendfile)
    <IfModule mod_xsendfile.c>
        XSendFile On
        XSendFilePath /var/www/dfms_private/secure_uploads
    </IfModule>

    # Directory permissions for DocumentRoot
    <Directory /var/www/dfms>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Deny direct access to logs, config, tests, docs
    <DirectoryMatch "^/var/www/dfms/(app/logs|app/config|docs|tests|\.git)">
        Require all denied
    </DirectoryMatch>

    # Deny direct HTTP access to secure_uploads path
    <Directory /var/www/dfms/secure_uploads>
        Require all denied
    </Directory>

    # Global Security Headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always unset Server
    Header always unset X-Powered-By
</VirtualHost>
