# Sample Nginx Configuration for DFMS Production Deployment
# Place in /etc/nginx/sites-available/dfms and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name dfms.ui.edu.ng;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dfms.ui.edu.ng;

    # SSL Configuration (configure with your institutional certificates)
    ssl_certificate /etc/ssl/certs/dfms.crt;
    ssl_certificate_key /etc/ssl/private/dfms.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Document Root: Point to repository root (or public/ if migrated)
    root /var/www/dfms;
    index public/index.php index.php;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 1. Deny sensitive directories and files unconditionally (Return 403/404)
    location ~* ^/(app/logs|app/config|docs|tests|\.git|\.env) {
        deny all;
        return 403;
    }

    # Deny direct access to SQL files, log files, configuration dumps
    location ~* \.(env|log|sql|bak|backup|json|neon|xml)$ {
        deny all;
        return 403;
    }

    # Deny direct public HTTP access to uploads directory
    location ~* ^/secure_uploads {
        deny all;
        return 403;
    }

    # 2. Internal X-Accel-Redirect Location for Controlled File Delivery (W2)
    # Accessible ONLY via internal redirects from PHP controllers
    location /internal_secure_uploads/ {
        internal;
        alias /var/www/dfms_private/secure_uploads/;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 3. Disable PHP execution in any uploaded document location
    location ~* ^/(secure_uploads|_staging)/.*\.php$ {
        deny all;
        return 403;
    }

    # 4. Standard Static Assets (CSS, JS, Images)
    location /app/src/ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # 5. Routing
    location / {
        try_files $uri $uri/ /public/index.php?$args;
    }

    # 6. PHP FastCGI execution
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param APP_ENV "production";
        fastcgi_param SENDFILE_MODE "nginx";
        fastcgi_param STORAGE_ROOT "/var/www/dfms_private/secure_uploads";
        fastcgi_param LOG_ROOT "/var/www/dfms_private/logs";
        include fastcgi_params;
    }
}
