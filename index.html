<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University of Ibadan DFMS - Login</title>
    <link rel="stylesheet" href="src/css/global.css">
    <link rel="stylesheet" href="src/css/styleguide.css">
    <link rel="stylesheet" href="src/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="log-in">
        <div class="div">
            <div class="overlap">
                <div class="overlap-group">
                    <div class="rectangle"></div>
                    <img class="image" src="src/assets/images/ui-logo.png" alt="University of Ibadan Logo" />
                    <div class="rectangle-2"></div>
                    <hr class="line" />
                    
                    <div class="frame-7">
                        <h1 class="text-wrapper-5">UNIVERSITY OF IBADAN</h1>
                        <h2 class="text-wrapper-6">DIGITAL FILE MANAGEMENT PORTAL</h2>
                    </div>

                    <div class="overlap-2">
                        <img class="img" src="src/assets/images/ui-logo-watermark.png" alt="University of Ibadan Logo Watermark" />
                        <div class="frame">
                            <h3 class="text-wrapper">Login</h3>
                            <div class="frame-2">
                                <div class="frame-3">
                                    <div class="frame-4">
                                        <div class="component-wrapper">
                                            <div class="component">
                                                <div class="frame-5">
                                                    <label class="input-label">Matric Number</label>
                                                    <span class="text-wrapper-2">*</span>
                                                </div>
                                                <div class="frame-6">
                                                    <input type="text" placeholder="Enter your matric number" class="input-content" id="matricNumber">
                                                </div>
                                            </div>
                                        </div>
                                        <div class="group">
                                            <div class="overlap-group-2">
                                                <div class="component-2">
                                                    <div class="frame-5">
                                                        <label class="input-label-2">Password</label>
                                                        <span class="text-wrapper-2">*</span>
                                                    </div>
                                                    <div class="frame-6">
                                                        <input type="password" placeholder="Enter your password" class="input-content-2" id="password">
                                                        <img class="COCO-line-eye-slash" id="togglePassword" src="src/assets/images/eye-slash.svg" alt="Toggle password visibility" />
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <button class="component-3">
                                        <span class="button-text">Sign In</span>
                                    </button>
                                    <p class="forgotten-password">
                                        <span class="span">Forgotten Password? </span>
                                        <a href="#" class="text-wrapper-4">Reset Password</a>
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="src/js/login.js"></script>
</body>
</html>
